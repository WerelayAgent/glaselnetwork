<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Wallet · Glasel Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#0D0F0C',
            foreground: '#FFFFFF',
            muted: '#8A8F88',
            primary: '#B4CDBC',
          },
          fontFamily: {
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', '"Liberation Mono"', '"Courier New"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #000;
      color: #fff;
    }
    .vanta-grid {
      background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 font-mono vanta-grid">
  <div class="max-w-md w-full bg-[#0D0F0C]/90 backdrop-blur-md border border-white/10 overflow-hidden relative">
    <!-- Top corner accents -->
    <div class="absolute top-0 left-0 w-2 h-2 border-t border-l border-primary"></div>
    <div class="absolute top-0 right-0 w-2 h-2 border-t border-r border-primary"></div>
    <div class="absolute bottom-0 left-0 w-2 h-2 border-b border-l border-primary"></div>
    <div class="absolute bottom-0 right-0 w-2 h-2 border-b border-r border-primary"></div>

    <div class="p-8 text-center">
      <div class="inline-block p-4 border border-white/10 bg-white/5 mb-6">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"></path><path d="M14 13.12c0 2.38 0 6.38-1 8.88"></path><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"></path><path d="M2 12a10 10 0 0 1 18-6"></path><path d="M2 16h.01"></path><path d="M21.8 16c.2-2 .131-5.354 0-6"></path><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"></path><path d="M8.65 22c.21-.66.45-1.32.57-2"></path><path d="M9 6.8a6 6 0 0 1 9 5.2v2"></path></svg>
      </div>
      
      <p class="text-[10px] uppercase tracking-[0.2em] text-primary mb-2">SYSTEM.AUTH</p>
      <h1 class="text-2xl tracking-tight mb-3">Identity Required</h1>
      <p class="text-muted text-xs leading-5 mb-8">Provision a durable identity and financial rails.<br/>Connect a Solana wallet to enter the runtime.</p>
      
      <div class="space-y-4">
        <button onclick="alert('Authentication Gateway Offline. Network deployment pending. Coming soon on pump.fun!')" class="group relative w-full flex items-center justify-center gap-3 bg-white/5 hover:bg-white/10 border border-white/10 text-white px-4 py-4 text-xs uppercase tracking-widest transition-all">
          <div class="absolute inset-y-0 left-0 w-1 bg-primary scale-y-0 group-hover:scale-y-100 transition-transform origin-bottom"></div>
          [ AUTH_PHANTOM ]
        </button>
        <button onclick="alert('Authentication Gateway Offline. Network deployment pending. Coming soon on pump.fun!')" class="group relative w-full flex items-center justify-center gap-3 bg-white/5 hover:bg-white/10 border border-white/10 text-muted px-4 py-4 text-xs uppercase tracking-widest transition-all">
          <div class="absolute inset-y-0 left-0 w-1 bg-white/30 scale-y-0 group-hover:scale-y-100 transition-transform origin-bottom"></div>
          [ AUTH_SOLFLARE ]
        </button>
      </div>

      <div class="mt-10 border-t border-white/10 pt-6">
        <a href="/" class="text-[10px] text-muted hover:text-primary uppercase tracking-[0.15em] transition-colors">← Abort sequence</a>
      </div>
    </div>
  </div>
</body>
</html>
